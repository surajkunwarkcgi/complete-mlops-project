name: CI - Train, Build and Deploy

on:
  push:
    branches: [main]
    # Ignore the automated image-tag commit so it doesn't re-register a training run.
    # The commit message also carries [skip ci] as a second guard
    paths-ignore:
      - "Model/k8s/deployment.yaml"
  pull_request:
    branches: [main]  

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: wine-quality-predictor
  # TODO: Replace with my GitHub username
  # GITOPS_REPO: surajkunwarkcgi/mlops-gitops

jobs:
  # Stage 1: SageMaker Training 
  train:
    name: SageMaker Training Job
    runs-on: ubuntu-latest

    # All run steps execute from Model/ so paths in scripts stay unchanged
    defaults:
      run:
        working-directory: Model

    # Required for OIDC token generation
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # TODO: Replace with output of: terraform output github_actions_role_arn
          role-to-assume: arn:aws:iam::REMOVED:role/retail-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          # No aws-access-key-id or aws-secret-access-key needed

      - name: Read all secrets from AWS Secrets Manager
        run: |
          # Read MLFlow credentials
          MLFLOW_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "mlflow-tracking-secrets" \
            --query SecretString --output text)  

          echo "MLFLOW_TRACKING_URI=$(echo $MLFLOW_SECRET | jq -r .MLFLOW_TRACKING_URI)" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=$(echo $MLFLOW_SECRET | jq -r .MLFLOW_TRACKING_USERNAME)" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=$(echo $MLFLOW_SECRET | jq -r .MLFLOW_TRACKING_PASSWORD)" >> $GITHUB_ENV

          # Read config values (SageMaker role ARN, S3 bucket)
          CONFIG=$(aws secretsmanager get-secret-value \
            --secret-id "github-actions-config" \
            --query SecretString --output text)

          echo "SAGEMAKER_ROLE_ARN=$(echo $CONFIG | jq -r .SAGEMAKER_ROLE_ARN)" >> $GITHUB_ENV
          echo "SAGEMAKER_BUCKET=$(echo $CONFIG | jq -r .SAGEMAKER_BUCKET)" >> $GITHUB_ENV  

      - name: Pull versioned data from S3 via DVC
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          dvc remote modify s3remote region ${{ env.AWS_REGION }} 
          dvc pull  
          # DVC reads .dvc pointer from Git -> pulls data version from S3

      - name: Trigger SageMaker Training Job
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: python sagemaker/sagemaker_pipeline.py

      - name: Wait for Model Registry approval
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          python - <<'EOF'
          import boto3, sys, time

          sm = boto3.client("sagemaker", region_name="ap-northeast-1")
          group = "WineQualityPredictor"
          max_wait = 300
          waited = 0

          while waited < max_wait:        
            versions = sm.list_model_packages(
              ModelPackageGroupName=group,
              SortBy="CreationTime",
              SortOrder="Descending",
              MaxResults=1

            )["ModelPackageSummaryList"]

            if not versions:
              print("No model versions found"); sys.exit(1)

            status = versions[0]["ModelApprovalStatus"]
            print(f"Model approval status: {status}")

            if status == "Approved":
              print("Model approved — proceeding to build"); sys.exit(0)
            elif status == "Rejected":
              print("Model rejected — stopping pipeline"); sys.exit(1)
            else:
              print(f"Waiting for approval... ({waited}s elapsed)")
              time.sleep(30)
              waited += 30

          print("Timed out waiting for model approval"); sys.exit(1)
          EOF

      - name: Upload model artifact for Docker build
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact
          path: Model/artifacts/model_trainer/model.joblib
          retention-days: 1


  # Stage 2: Build and Push to ECR
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: train          

    permissions:
      id-token: write
      contents: write  # neededd to push image tag update to k8s/deployment.yaml

    steps:
      - name: Checkout source code  
        uses: actions/checkout@v4

      - name: Download model artifact  
        uses: actions/download-artifact@v4
        with:
          name: model-artifact
          path: Model/artifacts/model_trainer/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REMOVED:role/retail-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # - name: Checkout GitOps repo   
      #   uses: actions/checkout@v4
      #   with:
      #     repository: ${{ env.GITOPS_REPO }} 
      #     token:      ${{ secrets.GITOPS_PAT }}
      #     path:       mlops-gitops

      - name: Update image tag in k8s/deployment.yaml   
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          sed -i "s|image:.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" \
            k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "ci: update image tag to $IMAGE_TAG [skip ci]"
          git push