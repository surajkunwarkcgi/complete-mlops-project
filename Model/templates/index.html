<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Quality Prediction</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <div style="width: 100%; max-width: 900px; padding: 20px; box-sizing: border-box;">
        <div style="background-image: url('static/assets/img/form-v9.jpg'); background-size: cover; background-position: center; border-radius: 10px; overflow: hidden; box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);">
            
            <form action="/predict" method="post" style="background: rgba(255, 255, 255, 0.92); padding: 40px; border-radius: 10px; display: flex; flex-direction: column; gap: 20px;">
                
                <h2 style="margin: 0 0 10px 0; text-align: center; color: #333; font-size: 28px; font-weight: 600;">Please Fill The Information</h2>
                
                <!-- Row 1 -->
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="fixed_acidity" style="font-weight: 600; font-size: 14px; color: #555;">Fixed Acidity:</label>
                        <input type="text" name="fixed_acidity" id="fixed_acidity" placeholder="e.g. 7.4" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="volatile_acidity" style="font-weight: 600; font-size: 14px; color: #555;">Volatile Acidity:</label>
                        <input type="text" name="volatile_acidity" id="volatile_acidity" placeholder="e.g. 0.70" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                </div>

                <!-- Row 2 -->
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="citric_acid" style="font-weight: 600; font-size: 14px; color: #555;">Citric Acid:</label>
                        <input type="text" name="citric_acid" id="citric_acid" placeholder="e.g. 0.00" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="residual_sugar" style="font-weight: 600; font-size: 14px; color: #555;">Residual Sugar:</label>
                        <input type="text" name="residual_sugar" id="residual_sugar" placeholder="e.g. 1.9" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                </div>

                <!-- Row 3 -->
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="chlorides" style="font-weight: 600; font-size: 14px; color: #555;">Chlorides:</label>
                        <input type="text" name="chlorides" id="chlorides" placeholder="e.g. 0.076" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="free_sulfur_dioxide" style="font-weight: 600; font-size: 14px; color: #555;">Free Sulfur Dioxide:</label>
                        <input type="text" name="free_sulfur_dioxide" id="free_sulfur_dioxide" placeholder="e.g. 11.0" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                </div>

                <!-- Row 4 -->
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="total_sulfur_dioxide" style="font-weight: 600; font-size: 14px; color: #555;">Total Sulfur Dioxide:</label>
                        <input type="text" name="total_sulfur_dioxide" id="total_sulfur_dioxide" placeholder="e.g. 34.0" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="density" style="font-weight: 600; font-size: 14px; color: #555;">Density:</label>
                        <input type="text" name="density" id="density" placeholder="e.g. 0.9978" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                </div>

                <!-- Row 5 -->
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="pH" style="font-weight: 600; font-size: 14px; color: #555;">pH:</label>
                        <input type="text" name="pH" id="pH" placeholder="e.g. 3.51" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="sulphates" style="font-weight: 600; font-size: 14px; color: #555;">Sulphates:</label>
                        <input type="text" name="sulphates" id="sulphates" placeholder="e.g. 0.56" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                </div>

                <!-- Row 6 -->
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <label for="alcohol" style="font-weight: 600; font-size: 14px; color: #555;">Alcohol:</label>
                        <input type="text" name="alcohol" id="alcohol" placeholder="e.g. 9.4" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
                    </div>
                </div>

                <!-- Submit Button -->
                <div style="text-align: center; margin-top: 15px;">
                    <input type="submit" name="register" value="Predict" style="background-color: #37517e; color: #ffffff; font-size: 16px; font-weight: 600; padding: 14px 40px; border: none; border-radius: 5px; cursor: pointer; transition: background 0.3s ease;">
                </div>

            </form>
        </div>
    </div>

</body>
</html>
